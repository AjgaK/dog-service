name: Dog Service CI/CD Pull-based

#on:
#  push:
#    branches:
#      - main
on:
  workflow_dispatch:

jobs:
  test-build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Dog Service
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn clean verify

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ajgak/dog-service:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ajgak/dog-service:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Push Docker image
        run: |
          docker push ajgak/dog-service:${{ github.sha }}

      - name: Checkout deployment repository
        uses: actions/checkout@v5
        with:
          repository: AjgaK/adoption-system-deployment
          token: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
          path: deployment

      - name: Update Dog Service image
        run: |
          sed -i "s|image: ajgak/dog-service:.*|image: ajgak/dog-service:${{ github.sha }}|" deployment/k8s/dog-service.yaml

      - name: Commit deployment manifest
        working-directory: deployment
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/dog-service.yaml
          git commit -m "Deploy dog-service ${{ github.sha }}"
          git push
