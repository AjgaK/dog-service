name: Dog Service CI/CD GitOps

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Dog Service
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn clean test

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ajgak/dog-service:${{ github.sha }}

      - name: Checkout deployment repository
        if: github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          repository: AjgaK/adoption-system-deployment
          token: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
          path: deployment

      - name: Update Dog Service image
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: ajgak/dog-service:.*|image: ajgak/dog-service:${{ github.sha }}|" deployment/k8s/dog-service.yaml

      - name: Commit deployment manifest
        if: github.event_name == 'push'
        working-directory: deployment
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/dog-service.yaml
          git commit -m "Deploy dog-service ${{ github.sha }}"
          git push
